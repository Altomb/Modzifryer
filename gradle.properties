# Project-wide Gradle settings for the modern build.

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is mandatory from AGP 8 onwards; the old com.android.support
# artifacts are gone from the repositories.
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8+ generates R fields as non-final `static int`, which is illegal in the
# ~40 `case R.id.foo:` / `case R.string.bar:` labels across this codebase.
# Restoring final fields keeps the switch statements compiling unchanged.
android.nonFinalResIds=false
